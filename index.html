<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全聯出貨地圖</title>
    <link href="./src/styles.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body class="flex flex-col sm:flex-row h-screen bg-gray-100">
    <button
      id="toggle-sidebar-btn"
      class="sm:hidden z-10 fixed top-1/2 right-2 -translate-y-1/2 bg-blue-500 text-white px-2 py-1 rounded-md"
    >
      <i class="material-icons">menu</i>
    </button>
    <div
      id="sidebar"
      class="sm:flex w-full sm:w-1/3 md:w-1/4 lg:max-w-md bg-white shadow-lg flex-col"
    >
      <div class="p-4 border-b">
        <h1 class="text-lg sm:text-xl font-bold text-gray-800">全聯出貨店家</h1>
      </div>

      <div class="p-4 border-b">
        <button
          id="my-location-btn"
          class="bg-blue-500 text-white px-3 py-2 rounded-md hover:bg-blue-600 flex items-center justify-center w-full"
        >
          <i class="material-icons text-base mr-2">my_location</i>
          移動到我的位置
        </button>
      </div>
      <div id="store-list-container" class="overflow-y-auto flex-grow hidden sm:block">
        <div class="p-2 bg-blue-50 border-b text-sm text-gray-600">
          <i class="material-icons text-sm align-middle">info</i>
          點擊店家名稱可查看詳細資訊
        </div>
        <div id="store-list" class=""></div>
      </div>

    </div>
    <div id="map-container" class="flex-1 h-1/2 sm:h-full relative">
      <div id="map" class="w-full h-full"></div>
      <div
        id="loading-overlay"
        class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10"
        style="display: none;"
      >
        <div class="text-center">
          <div class="loader"></div>
          <p id="loading-text" class="mt-2 text-gray-700">
            正在載入店家資料...
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="./src/script.js"></script>
  </body>
</html>
